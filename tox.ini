[tox]
requires =
    sphinx-scrapy @ git+https://github.com/scrapy/sphinx-scrapy.git@0.8.12
min_version = 4.25.0
envlist = pre-commit,mypy,types,docs,twinecheck,min,min-extra,py3{10-14},extra

[testenv]
package = editable
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest>=9.1.0
    pytest-asyncio
    pytest-cov
    requests
    aiohttp
    zyte-common-items
# -p no:web-poet disables the pytest plugin provided by web-poet. Otherwise,
# anything imported by that plugin will be missing from coverage data.
commands =
    pytest \
        --cov=web_poet \
        --cov-report=term-missing \
        --cov-report=xml \
        --doctest-modules \
        --ignore=web_poet/framework \
        -p no:web-poet \
        {posargs:web_poet tests}

[testenv:mypy]
extras = framework, frostwork
deps =
    mypy==2.3.1
    aiohttp==3.14.3
    andi==0.8.0
    pytest==9.1.1
    types-requests==2.33.0.20260712
    types-python-dateutil==2.9.0.20260807
    url-matcher==0.6.0
    zyte-common-items==0.29.0

commands = mypy web_poet tests

[testenv:types]
extras = framework, frostwork
deps =
    {[testenv]deps}
    {[testenv:mypy]deps}
    pytest-mypy-testing==0.2.0

commands = py.test {posargs: tests_typing}

[testenv:pre-commit]
deps = -rrequirements-dev.txt
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:min]
basepython = python3.10
setenv =
    {[testenv]setenv}
    # Pinned old library versions trigger warnings that we cannot fix, so this
    # env does not turn warnings into errors.
    PYTEST_ADDOPTS=-W default {env:PYTEST_ADDOPTS:}
deps =
    {[testenv]deps}
    pytest==9.1.0
    pytest-asyncio==0.17.2
    requests==2.27.0
    zyte-common-items==0.1.0
    aiohttp==3.7.0
    attrs==21.3.0
    parsel==1.5.0
    url-matcher==0.4.0
    tldextract==3.0.0
    multidict==5.0.0
    w3lib==1.22.0
    async-lru==1.0.3
    itemadapter==0.8.0
    andi==0.5.0
    python-dateutil==2.7.0
    time-machine==2.7.1
    packaging==22.0
    # pin older cssselect for old parsel
    cssselect==1.2.0

[testenv:benchmark]
extras = frostwork
deps =
    pytest>=9.1.0
    pytest-asyncio
    pytest-codspeed>=4.1.1
# The CodSpeed runner drives pytest-codspeed through CODSPEED_* variables, which
# have to reach the command tox runs for any measurement to happen.
passenv =
    *codspeed*
    *ci*
commands =
    pytest \
        -p no:web-poet \
        --codspeed \
        --codspeed-mode=simulation \
        {posargs:benchmarks}

[testenv:extra]
extras = framework, frostwork

[testenv:min-extra]
basepython = python3.10
extras = framework, frostwork
deps =
    {[testenv]deps}
    niquests==3.14.0
    playwright==1.20.0
    frostwork==0.1.6

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
